server:
  port: 8085

spring:
  application:
    name: result-service

services:
  voting-service:
    url: ${VOTING_SERVICE_URL:http://localhost:8084}
  candidate-service:
    url: ${CANDIDATE_SERVICE_URL:http://localhost:8083}
  election-service:
    url: ${ELECTION_SERVICE_URL:http://localhost:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
