server:
  port: 8080

spring:
  application:
    name: evoting-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/evotingdb}
    driverClassName: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:Hira2006@}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

services:
  voter-service:
    url: http://localhost:8080
  election-service:
    url: http://localhost:8080
  candidate-service:
    url: http://localhost:8080
  voting-service:
    url: http://localhost:8080
