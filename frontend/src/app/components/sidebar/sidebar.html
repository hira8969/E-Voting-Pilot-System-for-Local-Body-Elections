<aside class="w-64 bg-[#183153] h-full flex flex-col justify-between shrink-0 text-slate-300 border-r border-[#12243e] select-none overflow-y-auto z-30">
  <div>
    <!-- Logo & Brand Header -->
    <div class="px-5 py-4 border-b border-[#12243e] flex items-center gap-3">
      <div class="w-8 h-8 rounded-md bg-[#237C78] flex items-center justify-center text-white shrink-0">
        <app-icon name="vote" className="w-4 h-4"></app-icon>
      </div>
      <div class="leading-tight">
        <h1 class="text-xs font-bold text-white tracking-tight uppercase">State Election Commission</h1>
        <p class="text-[10px] text-slate-400">E-Voting Pilot System</p>
      </div>
    </div>

    <!-- Role Banner if present -->
    @if (roleBadge || title) {
      <div class="px-4 py-2 bg-[#12243e]/80 border-b border-[#12243e] flex items-center justify-between text-[10px]">
        <span class="font-bold uppercase tracking-wider text-slate-400">{{ title || 'PORTAL' }}</span>
        @if (roleBadge) {
          <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-[#237C78]/30 text-teal-300 border border-[#237C78]/50">
            {{ roleBadge }}
          </span>
        }
      </div>
    }

    <!-- Navigation Menu Items -->
    <nav class="p-3 space-y-1 mt-1">
      @for (item of menuItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-[#237C78] text-white font-semibold"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          class="flex items-center gap-3 px-3 py-2 rounded-md text-xs font-medium text-slate-300 hover:text-white hover:bg-[#12243e] transition-colors">
          <app-icon [name]="item.icon" className="w-4 h-4 shrink-0"></app-icon>
          <span class="flex-1 truncate">{{ item.label }}</span>
          @if (item.badge) {
            <span class="px-2 py-0.5 text-[10px] font-bold rounded" [ngClass]="item.badgeColor || 'bg-[#12243e] text-teal-300 border border-[#237C78]/40'">
              {{ item.badge }}
            </span>
          }
        </a>
      }
    </nav>
  </div>

  <!-- Bottom Session & Logout -->
  <div class="p-4 border-t border-[#12243e] space-y-2">
    <a
      routerLink="/"
      class="w-full flex items-center gap-2.5 px-3 py-2 rounded-md text-xs font-medium text-slate-400 hover:text-white hover:bg-[#12243e] transition-colors">
      <app-icon name="arrow-right" className="w-4 h-4 rotate-180"></app-icon>
      <span>Public Portal</span>
    </a>

    <button
      type="button"
      (click)="logout()"
      class="w-full flex items-center gap-2.5 px-3 py-2 rounded-md text-xs font-medium text-[#fca5a5] hover:text-white hover:bg-[#C53030]/20 transition-colors cursor-pointer">
      <app-icon name="logout" className="w-4 h-4 text-[#f87171]"></app-icon>
      <span>Sign Out</span>
    </button>
  </div>
</aside>
