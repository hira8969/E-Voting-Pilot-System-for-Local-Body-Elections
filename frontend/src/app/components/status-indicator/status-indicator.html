<div class="inline-flex items-center gap-2" role="status" [attr.aria-label]="label || state">
  <span class="relative flex h-2.5 w-2.5 shrink-0" aria-hidden="true">
    @if (ping) {
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75" [ngClass]="getPingClasses()"></span>
    }
    <span class="relative inline-flex rounded-full h-2.5 w-2.5" [ngClass]="getDotClasses()"></span>
  </span>
  <span class="text-xs font-semibold uppercase tracking-wider text-[#253247]">
    {{ label || state }}
  </span>
</div>
