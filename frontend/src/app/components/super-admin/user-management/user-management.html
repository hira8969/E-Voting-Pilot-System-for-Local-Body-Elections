<div class="space-y-6">

  <!-- TOP BREADCRUMB & BACK NAVIGATION BAR -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white px-4 py-2.5 rounded-xl border border-slate-200 shadow-2xs">
    <nav aria-label="Breadcrumb" class="text-xs text-slate-500">
      <ol class="flex items-center gap-2 flex-wrap">
        <li>
          <a routerLink="/" class="hover:text-blue-900 font-semibold transition-colors flex items-center gap-1.5">
            <app-icon name="vote" className="w-3.5 h-3.5 text-[#237C78]"></app-icon>
            <span>Home</span>
          </a>
        </li>
        <li class="text-slate-300">/</li>
        <li>
          <a routerLink="/super-admin/dashboard" class="hover:text-blue-900 font-medium transition-colors">Super Admin</a>
        </li>
        <li class="text-slate-300">/</li>
        <li class="font-bold text-blue-950">User Management</li>
      </ol>
    </nav>

    <!-- Navigation Action Buttons -->
    <div class="flex items-center gap-2">
      <a
        routerLink="/super-admin/dashboard"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold transition-all group shrink-0 cursor-pointer">
        <app-icon name="arrow-right" className="w-3 h-3 rotate-180 group-hover:-translate-x-0.5 transition-transform"></app-icon>
        <span>Back to Dashboard</span>
      </a>
      <a
        routerLink="/"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 hover:text-blue-950 text-xs font-bold shadow-2xs transition-all group shrink-0 cursor-pointer"
        title="Back to Public Homepage">
        <app-icon name="arrow-right" className="w-3.5 h-3.5 rotate-180 text-[#237C78] group-hover:-translate-x-0.5 transition-transform"></app-icon>
        <span>Back to Home</span>
      </a>
    </div>
  </div>
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">User Identity & Role Directory</h1>
      <p class="text-xs text-slate-500 mt-0.5">Control administrative roles, officer badge assignments, and observer accounts</p>
    </div>
    <div class="w-full sm:w-72">
      <app-search-box placeholder="Search users by name or role..." (searchChanged)="onSearch($event)"></app-search-box>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
    <app-data-table
      [columns]="columns"
      [data]="filteredUsers"
      [hasActions]="true"
      [actionsTemplate]="userActionTpl">
    </app-data-table>

    <ng-template #userActionTpl let-usr>
      <div class="flex items-center justify-end gap-2">
        <select
          [value]="usr.role"
          (change)="changeRole(usr, $event)"
          class="text-xs font-semibold bg-slate-50 border border-slate-300 rounded-lg p-1.5 focus:border-blue-900">
          <option value="VOTER">VOTER</option>
          <option value="PARTY_REP">PARTY_REP</option>
          <option value="OFFICER">OFFICER</option>
          <option value="OBSERVER">OBSERVER</option>
          <option value="SUPER_ADMIN">SUPER_ADMIN</option>
          <option value="SYSTEM_ADMIN">SYSTEM_ADMIN</option>
        </select>
      </div>
    </ng-template>
  </div>
</div>
