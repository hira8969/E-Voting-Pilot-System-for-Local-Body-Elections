<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">System Security & Audit Trail</h1>
      <p class="text-xs text-slate-500 mt-0.5">High-integrity immutable logging of all administrative actions and security events</p>
    </div>
    <div class="w-full sm:w-72">
      <app-search-box placeholder="Search audit logs..." (searchChanged)="onSearch($event)"></app-search-box>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
    <app-data-table
      [columns]="columns"
      [data]="filteredLogs"
      [hasActions]="true"
      [actionsTemplate]="auditActions">
    </app-data-table>

    <ng-template #auditActions let-log>
      <button
        type="button"
        class="text-xs font-semibold text-blue-900 hover:underline"
        (click)="viewDetails(log)">
        Inspect Block →
      </button>
    </ng-template>
  </div>
</div>
