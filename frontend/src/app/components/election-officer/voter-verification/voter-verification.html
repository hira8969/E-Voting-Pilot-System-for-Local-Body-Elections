<div class="space-y-6">

  <!-- TOP BREADCRUMB & BACK NAVIGATION BAR -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white px-4 py-2.5 rounded-xl border border-slate-200 shadow-2xs">
    <nav aria-label="Breadcrumb" class="text-xs text-slate-500">
      <ol class="flex items-center gap-2 flex-wrap">
        <li>
          <a routerLink="/" class="hover:text-blue-900 font-semibold transition-colors flex items-center gap-1.5">
            <app-icon name="vote" className="w-3.5 h-3.5 text-[#237C78]"></app-icon>
            <span>Home</span>
          </a>
        </li>
        <li class="text-slate-300">/</li>
        <li>
          <a routerLink="/officer/dashboard" class="hover:text-blue-900 font-medium transition-colors">Officer Station</a>
        </li>
        <li class="text-slate-300">/</li>
        <li class="font-bold text-blue-950">Voter Verification</li>
      </ol>
    </nav>

    <!-- Navigation Action Buttons -->
    <div class="flex items-center gap-2">
      <a
        routerLink="/officer/dashboard"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold transition-all group shrink-0 cursor-pointer">
        <app-icon name="arrow-right" className="w-3 h-3 rotate-180 group-hover:-translate-x-0.5 transition-transform"></app-icon>
        <span>Back to Dashboard</span>
      </a>
      <a
        routerLink="/"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 hover:text-blue-950 text-xs font-bold shadow-2xs transition-all group shrink-0 cursor-pointer"
        title="Back to Public Homepage">
        <app-icon name="arrow-right" className="w-3.5 h-3.5 rotate-180 text-[#237C78] group-hover:-translate-x-0.5 transition-transform"></app-icon>
        <span>Back to Home</span>
      </a>
    </div>
  </div>
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Voter Enrollment Verification</h1>
      <p class="text-xs text-slate-500 mt-0.5">Scrutinize new voter applications and identity credentials</p>
    </div>
    <div class="w-full sm:w-72">
      <app-search-box placeholder="Search Voter ID or Name..." (searchChanged)="onSearch($event)"></app-search-box>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
    <app-data-table
      [columns]="columns"
      [data]="filteredVoters"
      [hasActions]="true"
      [actionsTemplate]="actionTpl">
    </app-data-table>

    <ng-template #actionTpl let-voter>
      <div class="flex items-center justify-end gap-1.5">
        @if (voter.verificationStatus === 'PENDING') {
          <button
            type="button"
            class="px-2.5 py-1 text-xs font-semibold text-white bg-green-600 hover:bg-green-700 rounded-md shadow-2xs cursor-pointer"
            (click)="updateStatus(voter, 'VERIFIED')">
            ✓ Approve
          </button>
          <button
            type="button"
            class="px-2.5 py-1 text-xs font-semibold text-red-700 bg-red-50 hover:bg-red-100 rounded-md border border-red-200 cursor-pointer"
            (click)="updateStatus(voter, 'REJECTED')">
            ✕ Reject
          </button>
        } @else {
          <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded">
            Processed
          </span>
        }
      </div>
    </ng-template>
  </div>
</div>
