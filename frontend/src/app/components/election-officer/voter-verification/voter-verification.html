<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Voter Enrollment Verification</h1>
      <p class="text-xs text-slate-500 mt-0.5">Scrutinize new voter applications and identity credentials</p>
    </div>
    <div class="w-full sm:w-72">
      <app-search-box placeholder="Search Voter ID or Name..." (searchChanged)="onSearch($event)"></app-search-box>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
    <app-data-table
      [columns]="columns"
      [data]="filteredVoters"
      [hasActions]="true"
      [actionsTemplate]="actionTpl">
    </app-data-table>

    <ng-template #actionTpl let-voter>
      <div class="flex items-center justify-end gap-1.5">
        @if (voter.verificationStatus === 'PENDING') {
          <button
            type="button"
            class="px-2.5 py-1 text-xs font-semibold text-white bg-green-600 hover:bg-green-700 rounded-md shadow-2xs cursor-pointer"
            (click)="updateStatus(voter, 'VERIFIED')">
            ✓ Approve
          </button>
          <button
            type="button"
            class="px-2.5 py-1 text-xs font-semibold text-red-700 bg-red-50 hover:bg-red-100 rounded-md border border-red-200 cursor-pointer"
            (click)="updateStatus(voter, 'REJECTED')">
            ✕ Reject
          </button>
        } @else {
          <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded">
            Processed
          </span>
        }
      </div>
    </ng-template>
  </div>
</div>
