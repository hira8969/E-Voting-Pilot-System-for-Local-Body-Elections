<div class="space-y-6">
  
  <!-- Party Banner -->
  <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
    <div class="flex items-center gap-4">
      <div class="w-16 h-16 rounded-2xl bg-blue-50 border-2 border-blue-200 flex items-center justify-center text-3xl shadow-2xs">
        🌳
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-xl font-bold text-slate-900">Aam Vikas Party (AVP)</h1>
          <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-green-50 text-green-700 border border-green-200">
            ✓ RECOGNIZED STATE PARTY
          </span>
        </div>
        <p class="text-xs text-slate-500 mt-1">
          Reg No: <span class="font-mono text-slate-700">ECI/PP/2021/889</span> • Symbol: <strong class="text-slate-800">Banyan Tree (🌳)</strong>
        </p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <a routerLink="/party/candidates/register" class="px-4 py-2.5 bg-blue-900 hover:bg-blue-950 text-white rounded-xl text-xs font-bold shadow-xs transition-all flex items-center gap-2">
        <span>➕</span>
        <span>Nominate Candidate</span>
      </a>
      <a routerLink="/party/manifesto" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-colors">
        📄 View Manifesto
      </a>
    </div>
  </div>

  <!-- Metric Stat Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <app-stat-card
      title="Fielded Candidates"
      value="18"
      icon="👥"
      color="blue"
      subtitle="Across 18 Municipal Wards">
    </app-stat-card>

    <app-stat-card
      title="Affidavit Verifications"
      value="18 / 18"
      icon="✓"
      color="green"
      subtitle="100% Cleared by Returning Officer">
    </app-stat-card>

    <app-stat-card
      title="Manifesto Status"
      value="ACTIVE"
      icon="📜"
      color="purple"
      subtitle="Published for Sitamarhi 2026">
    </app-stat-card>

    <app-stat-card
      title="Polling Booth Agents"
      value="42 Assigned"
      icon="🛡️"
      color="amber"
      subtitle="Full booth agent coverage">
    </app-stat-card>
  </div>

  <!-- Nominated Candidates Table -->
  <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h2 class="text-lg font-bold text-slate-900">Official Nominated Candidates</h2>
        <p class="text-xs text-slate-500">List of verified party candidates contesting in local council</p>
      </div>
      <a routerLink="/party/candidates/register" class="text-xs font-bold text-blue-900 hover:underline">
        + Register New Candidate
      </a>
    </div>

    <app-data-table
      [columns]="candidateColumns"
      [data]="partyCandidates"
      [hasActions]="true"
      [actionsTemplate]="candidateActions">
    </app-data-table>

    <ng-template #candidateActions let-cand>
      <span class="text-xs font-semibold text-green-700 bg-green-50 px-2.5 py-1 rounded-md border border-green-200">
        Nomination Confirmed
      </span>
    </ng-template>
  </div>

</div>
