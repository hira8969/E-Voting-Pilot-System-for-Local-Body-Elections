<div class="min-h-screen flex flex-col bg-slate-50">
  <app-navbar></app-navbar>

  <div class="flex-1 max-w-7xl w-full mx-auto flex flex-col md:flex-row">
    <app-sidebar
      title="Observer Portal"
      roleBadge="OBSERVER"
      [menuItems]="menuItems"
      class="hidden md:block">
    </app-sidebar>

    <main class="flex-1 p-4 sm:p-6 lg:p-8 min-w-0">
      <div class="md:hidden flex items-center justify-between overflow-x-auto pb-3 mb-4 gap-2 border-b border-slate-200">
        @for (item of menuItems; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-blue-900 text-white font-semibold"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-700 bg-white border border-slate-200 whitespace-nowrap">
            {{ item.icon }} {{ item.label }}
          </a>
        }
      </div>

      <router-outlet></router-outlet>
    </main>
  </div>
</div>
