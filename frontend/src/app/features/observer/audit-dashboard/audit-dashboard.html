<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Immutable Audit Trail</h1>
      <p class="text-xs text-slate-500 mt-0.5">Statutory event ledger for election observers and judicial scrutiny</p>
    </div>
    <div class="w-full sm:w-72">
      <app-search-box placeholder="Search by event, IP or actor..." (searchChanged)="onSearch($event)"></app-search-box>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
    <app-data-table
      [columns]="columns"
      [data]="filteredLogs"
      [hasActions]="true"
      [actionsTemplate]="auditActionTpl">
    </app-data-table>

    <ng-template #auditActionTpl let-log>
      <span class="font-mono text-[10px] text-blue-900 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">
        {{ log.blockchainTxHash ? log.blockchainTxHash.substring(0, 14) + '...' : 'HASH_VERIFIED' }}
      </span>
    </ng-template>
  </div>
</div>
