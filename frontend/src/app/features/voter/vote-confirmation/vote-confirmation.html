<div class="min-h-[70vh] flex items-center justify-center p-4">
  <!-- Screen 6 in Reference Image -->
  <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200 p-8 sm:p-12 text-center shadow-xs">
    
    <!-- Big Green Check Circle Icon -->
    <div class="w-24 h-24 rounded-full bg-emerald-500 text-white flex items-center justify-center text-5xl mx-auto mb-6 shadow-xl shadow-emerald-500/25 animate-in zoom-in-75 duration-300">
      <svg class="w-12 h-12 stroke-white" fill="none" viewBox="0 0 24 24" stroke-width="3">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
    </div>

    <!-- Title -->
    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mb-2">
      Vote Submitted Successfully!
    </h1>

    <!-- Subtitle -->
    <p class="text-sm text-slate-500 mb-8 leading-relaxed max-w-sm mx-auto">
      Thank you for participating in the election. Your vote has been recorded securely.
    </p>

    <!-- Optional reference pill if candidate available -->
    @if (candidate) {
      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 mb-8 text-left text-xs space-y-1.5">
        <div class="flex justify-between items-center text-slate-500">
          <span>Ballot Status:</span>
          <span class="font-bold text-emerald-600">SEALED & TALLIED</span>
        </div>
        <div class="flex justify-between items-center text-slate-500">
          <span>Selected Choice:</span>
          <span class="font-bold text-slate-800">{{ candidate.name }} ({{ candidate.partyCode || candidate.partyName }})</span>
        </div>
      </div>
    }

    <!-- Action Button (Screen 6: Blue/Purple [Back to Dashboard] button) -->
    <button
      type="button"
      (click)="backToDashboard()"
      class="w-full py-3.5 px-6 bg-[#4F46E5] hover:bg-indigo-700 text-white text-sm font-bold rounded-2xl shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/35 transition-all transform hover:-translate-y-0.5 cursor-pointer">
      Back to Dashboard
    </button>
  </div>
</div>
