<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Apache Kafka Event Streams & Topics</h1>
      <p class="text-xs text-slate-500 mt-0.5">Real-time partitioned event streaming telemetry and consumer group lags</p>
    </div>
    <span class="px-3 py-1 bg-green-50 text-green-700 text-xs font-bold rounded-full border border-green-200">
      Broker Cluster: 3 Nodes (KRaft Active)
    </span>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <app-stat-card
      title="Total Active Topics"
      value="4"
      icon="⚡"
      color="blue"
      subtitle="EVM Event Streams">
    </app-stat-card>

    <app-stat-card
      title="Aggregate Throughput"
      value="2,065 msg/s"
      icon="📈"
      color="green"
      subtitle="Peak capacity: 50k msg/s">
    </app-stat-card>

    <app-stat-card
      title="Max Consumer Lag"
      value="8 msgs"
      icon="⏱️"
      color="purple"
      subtitle="voter.sms.notifications">
    </app-stat-card>

    <app-stat-card
      title="Under-replicated Partitions"
      value="0"
      icon="🛡️"
      color="green"
      subtitle="ISR: 100% In-Sync">
    </app-stat-card>
  </div>

  <!-- Topics Table -->
  <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
    <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wider mb-4">Kafka Topic Master Matrix</h3>
    <app-data-table
      [columns]="columns"
      [data]="topics">
    </app-data-table>
  </div>
</div>
