<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Apache Cassandra Distributed Storage Ring</h1>
      <p class="text-xs text-slate-500 mt-0.5">High-availability NoSQL ledger storage with masterless quorum replication</p>
    </div>
    <span class="px-3 py-1 bg-green-50 text-green-700 text-xs font-bold rounded-full border border-green-200">
      Ring Status: QUORUM OK (RF=3)
    </span>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <app-stat-card
      title="Cluster Node Status"
      value="3 / 3 UP"
      icon="🗄️"
      color="green"
      subtitle="Zero node downtime">
    </app-stat-card>

    <app-stat-card
      title="Total Data Footprint"
      value="423.6 GB"
      icon="💾"
      color="blue"
      subtitle="Compacted SSTables">
    </app-stat-card>

    <app-stat-card
      title="Mean Read Latency"
      value="1.4 ms"
      icon="⚡"
      color="purple"
      subtitle="4,200 reads/sec">
    </app-stat-card>

    <app-stat-card
      title="Mean Write Latency"
      value="0.8 ms"
      icon="🛡️"
      color="green"
      subtitle="6,800 writes/sec">
    </app-stat-card>
  </div>

  <!-- Nodes Master Table -->
  <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
    <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wider mb-4">Cassandra Node Ring Topologies</h3>
    <app-data-table
      [columns]="columns"
      [data]="nodes">
    </app-data-table>
  </div>
</div>
