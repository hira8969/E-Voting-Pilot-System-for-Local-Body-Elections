<div
  class="evm-ballot-row"
  [class.selected-row]="isSelected"
  (click)="onSelect()">
  
  <!-- Candidate Serial Number -->
  <div class="serial-num">
    {{ candidateIndex < 10 ? '0' + candidateIndex : candidateIndex }}
  </div>

  <!-- Candidate Name and Party Info -->
  <div class="candidate-meta">
    <span class="cand-name">{{ candidate.fullName }}</span>
    <span class="party-name">{{ candidate.partyName }}</span>
  </div>

  <!-- Candidate Party Symbol -->
  <div class="symbol-frame">
    <span class="symbol-graphic">{{ candidate.symbolUrl || '🗳️' }}</span>
  </div>

  <!-- EVM Red LED Indicator Lamp -->
  <div class="led-container">
    <div
      class="evm-led-lamp"
      [class.led-glow]="isSelected"
      title="Candidate Selection LED">
    </div>
  </div>

  <!-- EVM Tactile Blue Push Button -->
  <div class="button-container">
    <button
      type="button"
      [disabled]="disabled"
      class="evm-press-btn"
      [class.btn-active]="isSelected"
      (click)="$event.stopPropagation(); onSelect()"
      aria-label="Vote for Candidate">
      <span class="btn-arrow">▶</span>
    </button>
  </div>
</div>
