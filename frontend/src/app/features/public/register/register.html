<div class="min-h-screen flex flex-col justify-between bg-[#F8FAFC] py-8 px-4 sm:px-6 lg:px-8">
  <!-- Minimal Top Nav -->
  <header class="max-w-7xl mx-auto w-full flex items-center justify-between">
    <a routerLink="/" class="flex items-center gap-2.5 font-bold text-sm text-slate-800 hover:text-blue-600 transition-colors">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white text-base">
        🗳️
      </div>
      <span>Online Voting Management System</span>
    </a>
    <a routerLink="/login" class="text-xs font-semibold text-slate-500 hover:text-slate-800 transition-colors">
      Already registered? Login →
    </a>
  </header>

  <!-- Register Card (Screen 3 in Reference Image) -->
  <main class="flex-1 flex items-center justify-center my-6">
    <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
      
      <!-- Brand & Title -->
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center text-2xl mx-auto shadow-md shadow-blue-500/20 mb-3">
          🗳️
        </div>
        <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Online Voting Management System</h2>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight mt-1">Create Account</h1>
        <p class="text-xs text-slate-500 mt-1">Register to participate in elections</p>
      </div>

      <!-- Segmented Role Tabs (Screen 3: [Voter] [Candidate] [Administrator]) -->
      <div class="flex items-center p-1 bg-slate-100 rounded-xl mb-5 text-xs font-semibold">
        <button
          type="button"
          (click)="selectRole('VOTER')"
          [class]="selectedRole === 'VOTER' ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'"
          class="flex-1 py-2 rounded-lg transition-all text-center cursor-pointer">
          Voter
        </button>
        <button
          type="button"
          (click)="selectRole('CANDIDATE')"
          [class]="selectedRole === 'CANDIDATE' ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'"
          class="flex-1 py-2 rounded-lg transition-all text-center cursor-pointer">
          Candidate
        </button>
        <button
          type="button"
          (click)="selectRole('ADMIN')"
          [class]="selectedRole === 'ADMIN' ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'"
          class="flex-1 py-2 rounded-lg transition-all text-center cursor-pointer">
          Administrator
        </button>
      </div>

      <!-- Error Message Banner -->
      @if (errorMessage) {
        <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700 flex items-center gap-2">
          <span>⚠️</span>
          <span>{{ errorMessage }}</span>
        </div>
      }

      <form (submit)="onSubmit($event)" class="space-y-3.5">
        
        <!-- Full Name -->
        <div>
          <div class="relative">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
            <input
              type="text"
              name="fullName"
              [(ngModel)]="fullName"
              placeholder="Full Name"
              class="block w-full rounded-xl border border-slate-200 bg-white py-2.5 pl-10 pr-3.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/20"
              required>
          </div>
        </div>

        <!-- Email Address -->
        <div>
          <div class="relative">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
              </svg>
            </div>
            <input
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="Email Address"
              class="block w-full rounded-xl border border-slate-200 bg-white py-2.5 pl-10 pr-3.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/20"
              required>
          </div>
        </div>

        <!-- Password -->
        <div>
          <div class="relative">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </div>
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              placeholder="Password"
              class="block w-full rounded-xl border border-slate-200 bg-white py-2.5 pl-10 pr-10 text-sm text-slate-900 placeholder:text-slate-400 focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/20"
              required>
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 cursor-pointer">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <div class="relative">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </div>
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              placeholder="Confirm Password"
              class="block w-full rounded-xl border border-slate-200 bg-white py-2.5 pl-10 pr-10 text-sm text-slate-900 placeholder:text-slate-400 focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/20"
              required>
            <button
              type="button"
              (click)="toggleConfirmPassword()"
              class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 cursor-pointer">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Voter ID / Student ID -->
        <div>
          <div class="relative">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path>
              </svg>
            </div>
            <input
              type="text"
              name="voterId"
              [(ngModel)]="voterId"
              placeholder="Voter ID / Student ID"
              class="block w-full rounded-xl border border-slate-200 bg-white py-2.5 pl-10 pr-3.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/20"
              required>
          </div>
        </div>

        <!-- Register Button (Screen 3 in Reference Image: Purple button) -->
        <button
          type="submit"
          [disabled]="loading"
          class="w-full py-3 bg-[#4F46E5] hover:bg-indigo-700 disabled:opacity-50 text-white text-sm font-bold rounded-xl shadow-md shadow-indigo-500/20 hover:shadow-indigo-500/30 transition-all flex items-center justify-center gap-2 cursor-pointer mt-3">
          @if (loading) {
            <svg class="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Creating account...</span>
          } @else {
            <span>Register</span>
          }
        </button>
      </form>

      <!-- Already have account link -->
      <div class="mt-6 text-center text-xs text-slate-500">
        Already have an account?
        <a routerLink="/login" class="font-bold text-indigo-600 hover:underline ml-1">Login</a>
      </div>
    </div>
  </main>

  <footer class="text-center text-xs text-slate-400 py-2">
    Online Voting Management System • State Election Pilot Security
  </footer>
</div>
