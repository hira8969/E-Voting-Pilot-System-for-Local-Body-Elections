<div class="elections-page">
  <app-navbar></app-navbar>

  <div class="portal-body">
    @if (authService.isAuthenticated()) {
      <app-sidebar [mode]="authService.isAdmin() ? 'admin' : 'voter'"></app-sidebar>
    }

    <main class="elections-content">
      <div class="page-top">
        <div>
          <h2>Electoral Contests & Polling Schedules</h2>
          <p>Browse scheduled, active, and completed elections across all designated constituencies</p>
        </div>
      </div>

      <!-- Filters & Search Toolbar -->
      <div class="toolbar">
        <div class="filter-tabs">
          <button
            type="button"
            class="tab-btn"
            [class.active]="selectedFilter === 'ALL'"
            (click)="setFilter('ALL')">
            All ({{ elections.length }})
          </button>
          <button
            type="button"
            class="tab-btn"
            [class.active]="selectedFilter === 'ACTIVE'"
            (click)="setFilter('ACTIVE')">
            🟢 Active Live
          </button>
          <button
            type="button"
            class="tab-btn"
            [class.active]="selectedFilter === 'UPCOMING'"
            (click)="setFilter('UPCOMING')">
            📅 Upcoming
          </button>
          <button
            type="button"
            class="tab-btn"
            [class.active]="selectedFilter === 'COMPLETED'"
            (click)="setFilter('COMPLETED')">
            🏁 Completed
          </button>
        </div>

        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            [(ngModel)]="searchQuery"
            (input)="onSearchChange()"
            placeholder="Search ward, election, or type..."
            class="search-input" />
        </div>
      </div>

      <!-- Results Display -->
      @if (isLoading) {
        <app-loading message="Loading elections list from registry..."></app-loading>
      } @else if (filteredElections.length === 0) {
        <app-empty-state
          icon="🗳️"
          title="No Elections Match Your Filter"
          description="There are no elections in the system matching the selected category or search term."
          actionText="Reset Filters"
          (actionClick)="selectedFilter = 'ALL'; searchQuery = ''; applyFilter()">
        </app-empty-state>
      } @else {
        <div class="elections-grid">
          @for (item of filteredElections; track item.id) {
            <app-election-card [election]="item"></app-election-card>
          }
        </div>
      }
    </main>
  </div>
</div>
