<div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden transition-all duration-200" [ngClass]="{'hover:shadow-md hover:border-slate-300': hoverable, 'p-0': noPadding, 'p-6': !noPadding}">
  @if (title || subtitle) {
    <div class="border-b border-slate-100 pb-4 mb-4 flex items-center justify-between">
      <div>
        @if (title) {
          <h3 class="text-base font-semibold text-slate-900">{{ title }}</h3>
        }
        @if (subtitle) {
          <p class="text-xs text-slate-500 mt-0.5">{{ subtitle }}</p>
        }
      </div>
      <div class="card-header-actions">
        <ng-content select="[card-actions]"></ng-content>
      </div>
    </div>
  }
  <div class="card-body">
    <ng-content></ng-content>
  </div>
  <div class="card-footer">
    <ng-content select="[card-footer]"></ng-content>
  </div>
</div>
