<nav class="flex items-center justify-between border-t border-slate-200 bg-white px-4 py-3 sm:px-6" aria-label="Pagination">
  <div class="hidden sm:block">
    <p class="text-sm text-slate-600">
      Showing <span class="font-medium">{{ startItem }}</span> to <span class="font-medium">{{ endItem }}</span> of <span class="font-medium">{{ totalItems }}</span> results
    </p>
  </div>
  <div class="flex flex-1 justify-between sm:justify-end gap-2">
    <button
      type="button"
      [disabled]="currentPage <= 1"
      class="relative inline-flex items-center rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed"
      (click)="goToPage(currentPage - 1)">
      Previous
    </button>
    <button
      type="button"
      [disabled]="currentPage >= totalPages"
      class="relative inline-flex items-center rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed"
      (click)="goToPage(currentPage + 1)">
      Next
    </button>
  </div>
</nav>
