<aside class="w-64 bg-white border-r border-slate-200 min-h-[calc(100vh-4rem)] flex flex-col justify-between p-4 shrink-0">
  <div>
    <!-- Section Title -->
    @if (title) {
      <div class="px-3 mb-4 pb-2 border-b border-slate-100 flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">{{ title }}</span>
        @if (roleBadge) {
          <span class="px-2 py-0.5 rounded text-[10px] font-extrabold bg-blue-50 text-blue-800 border border-blue-200">
            {{ roleBadge }}
          </span>
        }
      </div>
    }

    <!-- Nav Items -->
    <nav class="space-y-1">
      @for (item of menuItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-blue-900 text-white font-semibold shadow-xs"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-100 transition-all duration-150">
          <span class="text-lg">{{ item.icon }}</span>
          <span class="flex-1">{{ item.label }}</span>
          @if (item.badge) {
            <span class="px-2 py-0.5 text-[10px] font-bold rounded-full" [ngClass]="item.badgeColor || 'bg-blue-100 text-blue-800'">
              {{ item.badge }}
            </span>
          }
        </a>
      }
    </nav>
  </div>

  <!-- Bottom Helper Card -->
  <div class="mt-6 pt-4 border-t border-slate-100">
    <div class="bg-blue-50/70 border border-blue-100 rounded-xl p-3 text-xs">
      <div class="flex items-center gap-1.5 text-blue-900 font-bold mb-1">
        <span>🛡️</span>
        <span>Secure Session</span>
      </div>
      <p class="text-slate-600 text-[11px] leading-relaxed">
        Encrypted via 256-bit ECC token. Audit telemetry active.
      </p>
    </div>
  </div>
</aside>
