<aside class="w-64 bg-[#0F172A] min-h-screen flex flex-col justify-between shrink-0 text-slate-300 border-r border-slate-800 select-none">
  <div>
    <!-- Logo & Brand Header -->
    <div class="px-5 py-5 border-b border-slate-800/80 flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-xl text-white shadow-md shadow-blue-600/30 shrink-0">
        🗳️
      </div>
      <div class="leading-tight">
        <h1 class="text-sm font-extrabold text-white tracking-tight">Online Voting</h1>
        <p class="text-[11px] font-medium text-slate-400">Management System</p>
      </div>
    </div>

    <!-- Role Banner if present -->
    @if (roleBadge || title) {
      <div class="px-5 py-2.5 bg-slate-900/60 border-b border-slate-800/60 flex items-center justify-between">
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">{{ title || 'PORTAL' }}</span>
        @if (roleBadge) {
          <span class="px-2 py-0.5 rounded text-[10px] font-extrabold bg-blue-500/20 text-blue-400 border border-blue-500/30">
            {{ roleBadge }}
          </span>
        }
      </div>
    }

    <!-- Navigation Menu Items -->
    <nav class="p-3 space-y-1.5 mt-2">
      @for (item of menuItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-[#2563EB] text-white font-semibold shadow-md shadow-blue-900/30"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/70 transition-all duration-150">
          <span class="text-base">{{ item.icon }}</span>
          <span class="flex-1 truncate">{{ item.label }}</span>
          @if (item.badge) {
            <span class="px-2 py-0.5 text-[10px] font-bold rounded-full" [ngClass]="item.badgeColor || 'bg-blue-900 text-blue-200 border border-blue-700/50'">
              {{ item.badge }}
            </span>
          }
        </a>
      }
    </nav>
  </div>

  <!-- Bottom Session & Logout -->
  <div class="p-4 border-t border-slate-800/80">
    <button
      (click)="logout()"
      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 transition-colors cursor-pointer">
      <span class="text-base">🚪</span>
      <span>Logout</span>
    </button>
  </div>
</aside>
