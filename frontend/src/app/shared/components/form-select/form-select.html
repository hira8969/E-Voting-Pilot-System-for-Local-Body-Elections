<div class="w-full">
  @if (label) {
    <label [for]="id" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
      {{ label }}
      @if (required) {
        <span class="text-red-500">*</span>
      }
    </label>
  }
  <div class="relative rounded-lg shadow-2xs">
    <select
      [id]="id"
      [value]="value"
      [disabled]="disabled"
      [required]="required"
      class="block w-full appearance-none rounded-lg border border-slate-300 bg-white py-2.5 pl-3.5 pr-10 text-sm text-slate-900 focus:border-blue-800 focus:outline-none focus:ring-1 focus:ring-blue-800 transition-colors"
      (change)="onChangeSelect($event)">
      @if (placeholder) {
        <option value="" disabled selected>{{ placeholder }}</option>
      }
      @for (opt of options; track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400">
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
      </svg>
    </div>
  </div>
  @if (hint) {
    <p class="mt-1 text-xs text-slate-500">{{ hint }}</p>
  }
</div>
