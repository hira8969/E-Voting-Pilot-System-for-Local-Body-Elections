<div class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
  @for (toast of toasts$ | async; track toast.id) {
    <div
      class="pointer-events-auto rounded-xl p-4 shadow-xl border flex items-start gap-3 transition-all duration-300 transform translate-y-0"
      [ngClass]="getToastClasses(toast.type)">
      <div class="text-lg shrink-0">
        @if (toast.type === 'success') { ✅ }
        @if (toast.type === 'error') { ❌ }
        @if (toast.type === 'warning') { ⚠️ }
        @if (toast.type === 'info') { ℹ️ }
      </div>
      <div class="flex-1">
        <h4 class="text-sm font-semibold text-slate-900">{{ toast.title }}</h4>
        <p class="text-xs text-slate-600 mt-0.5">{{ toast.message }}</p>
      </div>
      <button
        type="button"
        class="text-slate-400 hover:text-slate-600 -mr-1 -mt-1 p-1 rounded-md"
        (click)="dismiss(toast.id)">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
