<header class="bg-blue-950 text-white border-b border-blue-900 sticky top-0 z-40 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Brand & Election System Title -->
      <div class="flex items-center gap-3">
        <a routerLink="/" class="flex items-center gap-2.5 font-bold text-lg tracking-tight hover:opacity-95 transition-opacity">
          <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-xl shadow-md border border-blue-400">
            🗳️
          </div>
          <div>
            <span class="block text-base font-extrabold tracking-wide text-white leading-tight">E-VOTE INDIA</span>
            <span class="block text-[10px] font-medium tracking-wider text-blue-200 uppercase">Local Body Elections</span>
          </div>
        </a>

        @if (electionTitle) {
          <div class="hidden md:flex items-center ml-4 pl-4 border-l border-blue-800">
            <span class="text-xs font-semibold text-blue-200 bg-blue-900/60 px-2.5 py-1 rounded-md border border-blue-700/50">
              📍 {{ electionTitle }}
            </span>
          </div>
        }
      </div>

      <!-- Center / Role Demo Quick Switcher -->
      <div class="hidden lg:flex items-center gap-1.5 bg-blue-900/70 p-1 rounded-lg border border-blue-800 text-xs">
        <span class="text-blue-300 font-semibold px-2 text-[10px] uppercase">Portal:</span>
        <button
          type="button"
          class="px-2.5 py-1 rounded-md transition-colors font-medium"
          [ngClass]="currentUser?.role === 'VOTER' ? 'bg-blue-600 text-white shadow-xs' : 'text-blue-200 hover:text-white hover:bg-blue-800'"
          (click)="switchRole('VOTER')">
          🧑 Voter
        </button>
        <button
          type="button"
          class="px-2.5 py-1 rounded-md transition-colors font-medium"
          [ngClass]="currentUser?.role === 'PARTY_REP' ? 'bg-blue-600 text-white shadow-xs' : 'text-blue-200 hover:text-white hover:bg-blue-800'"
          (click)="switchRole('PARTY_REP')">
          🏛️ Party
        </button>
        <button
          type="button"
          class="px-2.5 py-1 rounded-md transition-colors font-medium"
          [ngClass]="currentUser?.role === 'OFFICER' ? 'bg-blue-600 text-white shadow-xs' : 'text-blue-200 hover:text-white hover:bg-blue-800'"
          (click)="switchRole('OFFICER')">
          🧑‍⚖️ Officer
        </button>
        <button
          type="button"
          class="px-2.5 py-1 rounded-md transition-colors font-medium"
          [ngClass]="currentUser?.role === 'OBSERVER' ? 'bg-blue-600 text-white shadow-xs' : 'text-blue-200 hover:text-white hover:bg-blue-800'"
          (click)="switchRole('OBSERVER')">
          👁️ Observer
        </button>
        <button
          type="button"
          class="px-2.5 py-1 rounded-md transition-colors font-medium"
          [ngClass]="currentUser?.role === 'SUPER_ADMIN' ? 'bg-blue-600 text-white shadow-xs' : 'text-blue-200 hover:text-white hover:bg-blue-800'"
          (click)="switchRole('SUPER_ADMIN')">
          👑 Admin
        </button>
        <button
          type="button"
          class="px-2.5 py-1 rounded-md transition-colors font-medium"
          [ngClass]="currentUser?.role === 'SYSTEM_ADMIN' ? 'bg-blue-600 text-white shadow-xs' : 'text-blue-200 hover:text-white hover:bg-blue-800'"
          (click)="switchRole('SYSTEM_ADMIN')">
          ⚙️ System
        </button>
      </div>

      <!-- Right Navigation & User Profile -->
      <div class="flex items-center gap-3">
        <!-- Live System Status indicator -->
        <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 bg-green-950/60 border border-green-700/60 rounded-full text-[11px] text-green-300 font-medium">
          <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
          <span>EVM Secure Link</span>
        </div>

        @if (currentUser) {
          <div class="flex items-center gap-3">
            <div class="text-right hidden sm:block">
              <p class="text-xs font-bold text-white leading-none">{{ currentUser.name }}</p>
              <p class="text-[10px] font-semibold text-blue-300 uppercase tracking-wider mt-0.5">{{ currentUser.role }}</p>
            </div>
            
            <div class="w-9 h-9 rounded-full bg-blue-800 border-2 border-blue-600 flex items-center justify-center text-sm font-bold text-white shadow-xs">
              {{ currentUser.name.charAt(0) }}
            </div>

            <button
              type="button"
              class="text-xs font-semibold text-red-300 hover:text-white hover:bg-red-900/60 px-2.5 py-1.5 rounded-lg border border-red-800/50 transition-colors"
              (click)="logout()">
              Logout
            </button>
          </div>
        } @else {
          <div class="flex items-center gap-2">
            <a routerLink="/login" class="px-3.5 py-1.5 text-xs font-semibold text-blue-100 hover:text-white hover:bg-blue-900 rounded-lg transition-colors">
              Login
            </a>
            <a routerLink="/register" class="px-3.5 py-1.5 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-500 rounded-lg shadow-sm transition-colors">
              Register
            </a>
          </div>
        }
      </div>

    </div>
  </div>
</header>
