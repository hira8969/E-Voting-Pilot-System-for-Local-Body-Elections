<div class="text-center py-12 px-4 bg-white rounded-xl border border-slate-200 shadow-2xs">
  <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-2xl mx-auto mb-4 text-slate-400">
    <span>{{ icon }}</span>
  </div>
  <h3 class="text-base font-semibold text-slate-900">{{ title }}</h3>
  <p class="mt-1 text-sm text-slate-500 max-w-sm mx-auto">{{ description }}</p>
  @if (actionText) {
    <div class="mt-6">
      <button
        type="button"
        class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-blue-900 hover:bg-blue-950 rounded-lg shadow-xs"
        (click)="actionClicked.emit()">
        {{ actionText }}
      </button>
    </div>
  }
</div>
