<div class="inline-flex items-center gap-2">
  <span class="relative flex h-3 w-3">
    @if (ping) {
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75" [ngClass]="getPingClasses()"></span>
    }
    <span class="relative inline-flex rounded-full h-3 w-3" [ngClass]="getDotClasses()"></span>
  </span>
  @if (label) {
    <span class="text-xs font-semibold uppercase tracking-wider text-slate-700">{{ label }}</span>
  }
</div>
