@if (isOpen) {
  <div class="fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity" (click)="onCancel()"></div>
    <div class="flex min-h-full items-center justify-center p-4 text-center">
      <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-lg p-6">
        <div class="flex items-start gap-4">
          <div class="w-12 h-12 rounded-full flex items-center justify-center shrink-0" [ngClass]="getIconClasses()">
            <span>{{ icon }}</span>
          </div>
          <div>
            <h3 class="text-lg font-semibold text-slate-900">{{ title }}</h3>
            <p class="text-sm text-slate-600 mt-2 leading-relaxed">{{ message }}</p>
            <ng-content></ng-content>
          </div>
        </div>
        <div class="mt-6 flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
          <button
            type="button"
            class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-400"
            (click)="onCancel()">
            {{ cancelText }}
          </button>
          <button
            type="button"
            class="px-5 py-2 text-sm font-semibold text-white rounded-lg focus:outline-none focus:ring-2 shadow-sm"
            [ngClass]="getConfirmButtonClasses()"
            (click)="onConfirm()">
            {{ confirmText }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
