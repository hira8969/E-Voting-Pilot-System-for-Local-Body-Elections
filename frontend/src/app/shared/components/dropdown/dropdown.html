<div class="relative inline-block text-left">
  <button
    type="button"
    class="inline-flex w-full items-center justify-between gap-x-1.5 rounded-lg bg-white px-3.5 py-2 text-sm font-medium text-slate-700 shadow-2xs ring-1 ring-inset ring-slate-300 hover:bg-slate-50"
    (click)="toggle()">
    <span>{{ selectedLabel || placeholder }}</span>
    <svg class="-mr-1 h-4 w-4 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
    </svg>
  </button>

  @if (isOpen) {
    <div class="absolute right-0 z-20 mt-2 w-56 origin-top-right rounded-xl bg-white p-1 shadow-lg ring-1 ring-black/5 focus:outline-none">
      @for (item of items; track item.value) {
        <button
          type="button"
          class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-blue-50 hover:text-blue-900 transition-colors text-left"
          (click)="selectItem(item)">
          @if (item.icon) {
            <span>{{ item.icon }}</span>
          }
          <span>{{ item.label }}</span>
        </button>
      }
    </div>
  }
</div>
