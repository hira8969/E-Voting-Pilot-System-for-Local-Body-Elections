<div class="bg-white rounded-xl border border-slate-200 p-5 shadow-xs transition-all duration-200 hover:shadow-md hover:border-slate-300">
  <div class="flex items-start justify-between">
    <div>
      <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">{{ title }}</p>
      <h3 class="text-2xl font-bold text-slate-900 mt-1.5">{{ value }}</h3>
      @if (trend || subtitle) {
        <div class="flex items-center mt-2 text-xs">
          @if (trend) {
            <span class="font-medium inline-flex items-center mr-1.5" [ngClass]="{'text-green-600': trendDirection === 'up', 'text-red-600': trendDirection === 'down', 'text-slate-500': trendDirection === 'neutral'}">
              @if (trendDirection === 'up') { ↑ }
              @if (trendDirection === 'down') { ↓ }
              {{ trend }}
            </span>
          }
          @if (subtitle) {
            <span class="text-slate-500">{{ subtitle }}</span>
          }
        </div>
      }
    </div>
    @if (icon) {
      <div class="w-12 h-12 rounded-lg flex items-center justify-center text-xl" [ngClass]="getIconBgClasses()">
        <span>{{ icon }}</span>
      </div>
    }
  </div>
</div>
